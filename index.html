<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#07150f" />
    <meta name="description" content="A tiny four-level reptile and amphibian escape game by Alien Arboreal." />
    <title>Gecko Escape</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307150f'/%3E%3Cpath d='M13 34c7-15 22-21 35-12 7 5 3 14-5 12-5-1-5-7-1-8-9-5-17 2-20 10-2 6-7 10-12 9' fill='none' stroke='%238fe36a' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='48' cy='24' r='2' fill='%23fff7d6'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <div>
          <p class="eyebrow">ALIEN ARBOREAL PRESENTS</p>
          <h1>GECKO ESCAPE</h1>
        </div>
        <button id="soundButton" class="icon-button" type="button" aria-pressed="true" aria-label="Turn sound off">SOUND: ON</button>
      </header>

      <section class="stage-wrap" aria-label="Gecko Escape game">
        <canvas id="game" width="960" height="540" tabindex="0" aria-label="Gecko Escape. Choose a character, use arrow keys or WASD to move, Space to jump, and E for your ability."></canvas>

        <div id="overlay" class="overlay">
          <div class="panel">
            <p id="panelKicker" class="panel-kicker">STORY MODE</p>
            <h2 id="panelTitle">The enclosure door is open.</h2>
            <p id="panelText">This is almost certainly a trap. Unfortunately, you are a gecko.</p>
            <div id="characterSelect" class="character-select hidden" aria-label="Choose your escape artist">
              <button type="button" class="character-card" data-character="chameleon">
                <span class="character-icon chameleon-icon" aria-hidden="true">◉</span>
                <strong>CHAMELEON</strong>
                <small>Catches bugs with its tongue and changes colour to camouflage.</small>
              </button>
              <button type="button" class="character-card" data-character="crested">
                <span class="character-icon crested-icon" aria-hidden="true">♛</span>
                <strong>CRESTED GECKO</strong>
                <small>Uses a short tongue for nearby prey and drops its tail to escape danger.</small>
              </button>
              <button type="button" class="character-card" data-character="newt">
                <span class="character-icon newt-icon" aria-hidden="true">●</span>
                <strong>FIRE-BELLY NEWT</strong>
                <small>Regenerates health behind a temporary shield, uses toxic defence, and never needs air.</small>
              </button>
              <button type="button" class="character-card" data-character="frog">
                <span class="character-icon frog-icon" aria-hidden="true">●</span>
                <strong>AZUREUS DART FROG</strong>
                <small>Power-leaps through the air and catches prey with its tongue.</small>
              </button>
              <button type="button" class="character-card" data-character="boa">
                <span class="character-icon boa-icon" aria-hidden="true">≈</span>
                <strong>BLACK COLOMBIAN BOA</strong>
                <small>Coils to constrict hazards and strikes living enemies.</small>
              </button>
            </div>
            <button id="primaryButton" class="primary-button" type="button">BEGIN ESCAPE</button>
            <button id="secondaryButton" class="secondary-button hidden" type="button">LEVEL SELECT</button>
          </div>
        </div>

        <div id="hud" class="hud hidden" aria-live="polite">
          <span id="levelLabel">LEVEL 1 · EASY</span>
          <span id="bugLabel">BUGS 0/3</span>
          <span id="abilityLabel">ABILITY READY</span>
          <span id="lifeLabel">♥ ♥ ♥</span>
        </div>
      </section>

      <div class="controls-row">
        <p class="keyboard-help"><strong>MOVE</strong> WASD / ARROWS &nbsp; <strong>JUMP</strong> SPACE &nbsp; <strong>PRIMARY</strong> E &nbsp; <strong>SECONDARY</strong> R</p>
        <div class="touch-controls" aria-label="Touch controls">
          <button type="button" data-control="left" aria-label="Move left">◀</button>
          <button type="button" data-control="right" aria-label="Move right">▶</button>
          <button type="button" data-control="jump" aria-label="Jump">↑</button>
          <button id="abilityButton" type="button" data-control="primary" class="ability-control" aria-label="Use primary ability">ABILITY</button>
          <button id="tongueButton" type="button" data-control="secondary" class="tongue-control hidden" aria-label="Use secondary ability">SPECIAL</button>
        </div>
      </div>
    </main>
    <script src="game.js"></script>
  </body>
</html>
